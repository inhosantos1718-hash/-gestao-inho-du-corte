/* Campos de data: manter o calendário visível e acessível em telas escuras */

.stock-focus{border-color:var(--gold)!important;box-shadow:0 0 0 2px #d4af3744,0 12px 30px #0007!important;animation:stockFocus 1.3s ease-in-out 2;}
